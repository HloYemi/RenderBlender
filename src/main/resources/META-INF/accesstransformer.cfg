# Access Transformer — RenderBlender
#
# PORTING NOTE (1.20.1 Forge -> 1.21.1 NeoForge):
# NeoForge 1.21.1 uses official Mojang mappings, so the previous SRG names
# (e.g. m_44054_, f_173331_) are no longer valid and have been removed to
# avoid build errors. They must be re-authored using Mojang member names.
#
# The most important entries to restore (rendering core) are:
#   - net.minecraft.client.renderer.ShaderInstance   (uniforms field, parseUniformNode)
#   - com.mojang.blaze3d.shaders.Uniform              (intValues, floatValues, dirty, set/setSafe family)
#   - net.minecraft.client.renderer.RenderType / RenderStateShard
#   - com.mojang.blaze3d.vertex.BufferBuilder         (format)
#   - com.mojang.blaze3d.vertex.DefaultedVertexConsumer (defaultColorSet)
#
# Mixin @Accessor / @Invoker in init/mixins do NOT require AT entries.
